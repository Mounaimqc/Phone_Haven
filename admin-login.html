<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Phone Haven / Terminal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="images/logo.jpeg" type="image/x-icon">

    <style>
        body {
            background-color: #020617;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        .lock-shadow {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.2);
        }
    </style>
    
<style>
        /* ✅ PHONE HAVEN BRAND THEME */
        :root {
            --brand-gold: #FFBA08;
            --brand-coral: #FF3366;
            --bg-night: #0B0F19;
            --bg-surface: #141A2B;
            --bg-card: #182035;
        }

        body {
            background-color: #0B0F19 !important;
            color: #E2E8F0;
        }

        .tech-pattern-bg {
            background-color: #0B0F19;
            background-image: 
                radial-gradient(ellipse at 80% 10%, rgba(255, 186, 8, 0.09) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 60%, rgba(255, 51, 102, 0.07) 0%, transparent 50%),
                url('images/tech-pattern.svg');
            background-repeat: repeat;
            background-size: auto, auto, 360px 360px;
            background-attachment: fixed;
        }

        /* ✅ SIGNATURE PHONE HAVEN GRADIENT (GOLD TO CORAL) */
        .gradient-bg {
            background: linear-gradient(135deg, #FFBA08 0%, #FF3366 100%) !important;
        }

        .gradient-text {
            background: linear-gradient(135deg, #FFBA08 0%, #FF8040 50%, #FF3366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-gold {
            background: linear-gradient(135deg, #FFD166 0%, #FFBA08 50%, #F59E0B 100%);
        }

        .gradient-coral {
            background: linear-gradient(135deg, #FF6B8B 0%, #FF3366 100%);
        }

        .gradient-hover:hover {
            background: linear-gradient(135deg, #FFBA08 0%, #FF3366 100%) !important;
        }

        /* ✅ LUXURY GLASS & CARDS */
        .glass {
            background: rgba(20, 26, 43, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-light {
            background: rgba(26, 34, 56, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 186, 8, 0.2);
        }

        .glass-card {
            background: rgba(21, 28, 46, 0.90);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .glass-card:hover {
            border-color: rgba(255, 186, 8, 0.4);
            box-shadow: 0 12px 36px rgba(255, 186, 8, 0.12);
        }

        /* ✅ TEXT COLORS */
        .text-heading {
            color: #ffffff !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .text-body {
            color: #E2E8F0 !important;
        }

        .text-muted {
            color: #94A3B8 !important;
        }

        .text-accent-yellow {
            color: #FFBA08 !important;
            text-shadow: 0 0 14px rgba(255, 186, 8, 0.35);
        }

        .text-accent-pink {
            color: #FF3366 !important;
            text-shadow: 0 0 14px rgba(255, 51, 102, 0.35);
        }

        .text-accent-purple {
            color: #FFD166 !important;
        }

        .text-secondary {
            color: #FF3366 !important;
        }

        .text-services {
            color: #06b6d4 !important;
        }

        /* ✅ HOVER EFFECTS */
        .link-hover:hover {
            color: #FFBA08 !important;
            text-shadow: 0 0 14px rgba(255, 186, 8, 0.6) !important;
            transition: all 0.2s ease;
        }

        /* ✅ INPUTS & FORMS */
        .form-input {
            color: #ffffff !important;
            background-color: rgba(20, 26, 43, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }

        .form-input::placeholder {
            color: #94A3B8 !important;
        }

        .form-input:focus, input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: #FFBA08 !important;
            box-shadow: 0 0 0 3px rgba(255, 186, 8, 0.25) !important;
        }

        .form-select {
            color: #ffffff !important;
            background-color: #141A2B !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }

        .form-select option {
            color: #ffffff !important;
            background-color: #141A2B !important;
        }

        .form-label {
            color: #E2E8F0 !important;
        }

        /* ✅ STICKY HEADER SCROLLED */
        #nav-header.scrolled {
            background-color: rgba(11, 15, 25, 0.95) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 186, 8, 0.25) !important;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        /* ✅ ACCESSIBILITY */
        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid #FFBA08 !important;
            outline-offset: 2px;
        }

        /* ✅ BUTTONS */
        .btn-premium {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(255, 186, 8, 0.4);
        }
        .btn-premium:active {
            transform: translateY(0) scale(0.98);
        }
</style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 xs:p-6 tech-pattern-bg bg-[#0B0F19] text-[#E2E8F0] selection:bg-[#FFBA08]/30">
    <div class="w-full max-w-md">
        <div class="glass-card p-8 sm:p-12 rounded-[2.5rem] border border-white/10 relative overflow-hidden shadow-2xl">
            <!-- Glow background -->
            <div class="absolute top-0 right-0 w-48 h-48 bg-[#FFBA08]/15 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-[#FF3366]/15 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>

            <div class="relative z-10 flex flex-col items-center">
                <!-- Mascot / Lock Badge -->
                <div class="size-20 bg-[#141A2B] border-2 border-[#FFBA08]/40 text-[#FFBA08] rounded-[2rem] flex items-center justify-center mb-8 shadow-2xl shadow-[#FFBA08]/20 rotate-6 overflow-hidden p-2">
                    <img src="images/logo.jpeg" alt="Phone Haven Mascot" class="w-full h-full object-contain rounded-xl">
                </div>

                <h1 class="font-display text-2xl sm:text-3xl font-black tracking-tight text-white mb-1">
                    <span class="text-[#FFBA08]">Phone</span><span class="text-[#FF3366] italic">Haven</span> Terminal
                </h1>
                <p class="text-[#FFBA08] text-[10px] font-bold uppercase tracking-[0.25em] mb-8">Espace Administration Sécurisé</p>

                <form id="login-form" class="w-full space-y-5">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-[#94A3B8] ml-2">Mot de passe Administrateur</label>
                        <input type="password" id="password" required
                            class="w-full h-14 bg-[#0B0F19] border border-white/15 rounded-2xl px-6 text-white font-bold tracking-widest focus:outline-none focus:border-[#FFBA08] focus:ring-4 focus:ring-[#FFBA08]/20 transition-all text-center text-sm"
                            placeholder="••••••••">
                    </div>

                    <button type="submit"
                        class="w-full h-14 gradient-bg text-slate-950 font-black rounded-2xl text-xs uppercase tracking-[0.15em] shadow-lg shadow-[#FFBA08]/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span>Accéder au Dashboard</span>
                        <span class="material-symbols-outlined text-[18px]">lock_open</span>
                    </button>

                    <p id="error-msg"
                        class="text-[#FF3366] text-xs font-bold text-center hidden">Mot de passe incorrect</p>
                </form>
            </div>
        </div>

        <p class="text-center mt-8 text-[11px] font-bold text-slate-400">© 2026 Phone Haven · Sétif, Algérie</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (password === 'Phonehaven19') {
                localStorage.setItem('admin_authenticated', 'true');
                window.location.href = 'admin-orders.html';
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('password').value = '';
                setTimeout(() => errorMsg.classList.add('hidden'), 3000);
            }
        });
    </script>
</body>

</html>
