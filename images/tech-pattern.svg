<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <defs>
    <style>
      .stroke-subtle { stroke: rgba(255, 186, 8, 0.08); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-cyan { stroke: rgba(16, 185, 129, 0.06); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fill-dot { fill: rgba(255, 186, 8, 0.12); }
    </style>
  </defs>

  <!-- Smartphone 1 -->
  <rect x="40" y="40" width="46" height="82" rx="9" class="stroke-subtle" />
  <rect x="53" y="46" width="20" height="3" rx="1.5" class="stroke-subtle" />
  <circle cx="63" cy="112" r="3" class="stroke-subtle" />

  <!-- Over-Ear Headphones -->
  <path d="M 190 70 A 30 30 0 0 1 250 70" class="stroke-subtle" />
  <rect x="182" y="65" width="10" height="24" rx="4" class="stroke-subtle" />
  <rect x="248" y="65" width="10" height="24" rx="4" class="stroke-subtle" />
  <path d="M 187 89 C 187 102 205 106 215 106" class="stroke-subtle" />
  <circle cx="218" cy="106" r="3" class="fill-dot" />

  <!-- Gear / Cog -->
  <g transform="translate(130, 80)">
    <circle cx="16" cy="16" r="8" class="stroke-cyan" />
    <circle cx="16" cy="16" r="3.5" class="stroke-cyan" />
    <path d="M 16 4 L 16 8 M 16 24 L 16 28 M 4 16 L 8 16 M 24 16 L 28 16 M 7.5 7.5 L 10.5 10.5 M 21.5 21.5 L 24.5 24.5 M 7.5 24.5 L 10.5 21.5 M 21.5 10.5 L 24.5 7.5" class="stroke-cyan" />
  </g>

  <!-- Circuit Traces Top -->
  <path d="M 86 70 L 120 70 L 135 55 L 175 55" class="stroke-line" />
  <circle cx="175" cy="55" r="2.5" class="fill-dot" />
  <path d="M 63 122 L 63 150 L 80 167 L 120 167" class="stroke-line" />
  <circle cx="120" cy="167" r="2.5" class="fill-dot" />

  <!-- Smartphone 2 (Bottom right) -->
  <rect x="260" y="220" width="48" height="84" rx="9" class="stroke-subtle" />
  <rect x="274" y="226" width="20" height="3" rx="1.5" class="stroke-subtle" />
  <circle cx="284" cy="294" r="3" class="stroke-subtle" />

  <!-- Charger Plug -->
  <g transform="translate(140, 210)">
    <rect x="10" y="14" width="26" height="30" rx="5" class="stroke-subtle" />
    <line x1="16" y1="4" x2="16" y2="14" class="stroke-subtle" />
    <line x1="30" y1="4" x2="30" y2="14" class="stroke-subtle" />
    <path d="M 23 44 L 23 58 L 35 70" class="stroke-line" />
    <circle cx="35" cy="70" r="2.5" class="fill-dot" />
  </g>

  <!-- Earphones / In-Ear -->
  <g transform="translate(45, 230)">
    <circle cx="14" cy="16" r="6" class="stroke-subtle" />
    <circle cx="34" cy="16" r="6" class="stroke-subtle" />
    <path d="M 14 22 C 14 36 24 45 24 60" class="stroke-subtle" />
    <path d="M 34 22 C 34 36 24 45 24 60" class="stroke-subtle" />
    <line x1="24" y1="60" x2="24" y2="78" class="stroke-subtle" />
  </g>

  <!-- Connected Nodes & Constellation -->
  <g transform="translate(260, 90)">
    <circle cx="10" cy="10" r="3" class="fill-dot" />
    <circle cx="45" cy="25" r="3" class="fill-dot" />
    <circle cx="25" cy="50" r="3" class="fill-dot" />
    <line x1="10" y1="10" x2="45" y2="25" class="stroke-line" />
    <line x1="45" y1="25" x2="25" y2="50" class="stroke-line" />
    <line x1="25" y1="50" x2="10" y2="10" class="stroke-line" />
  </g>

  <!-- Circuit Traces Bottom -->
  <path d="M 200 310 L 225 310 L 245 290 L 260 290" class="stroke-line" />
  <circle cx="200" cy="310" r="2.5" class="fill-dot" />
  <path d="M 110 320 L 135 320 L 155 340 L 190 340" class="stroke-line" />
  <circle cx="190" cy="340" r="2.5" class="fill-dot" />

  <!-- Small Gear -->
  <g transform="translate(300, 160)">
    <circle cx="12" cy="12" r="6" class="stroke-subtle" />
    <circle cx="12" cy="12" r="2.5" class="stroke-subtle" />
    <path d="M 12 3 L 12 6 M 12 18 L 12 21 M 3 12 L 6 12 M 18 12 L 21 12" class="stroke-subtle" />
  </g>
</svg>
